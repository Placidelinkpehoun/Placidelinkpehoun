name: Generate Snake Animation

on:
  # 🕒 Exécute automatiquement toutes les 24 heures
  schedule:
    - cron: "0 0 * * *"   # chaque jour à minuit (UTC)
  
  # ▶️ Permet de le lancer manuellement depuis l’onglet Actions
  workflow_dispatch:
  
  # 🔁 S’exécute à chaque push sur la branche main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 📥 Clone le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Génère les fichiers SVG du serpent des contributions
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: PlacideLinkpehoun
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 🚀 Push des SVG vers la branche `output`
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
