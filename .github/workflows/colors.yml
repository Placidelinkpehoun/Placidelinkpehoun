name: Color vote

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: color-vote
  cancel-in-progress: false

jobs:
  vote:
    if: startsWith(github.event.issue.title, 'color|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - id: vote
        run: python scripts/colors.py vote
        env:
          # passed through env (never interpolated in the script) to avoid injection
          VOTE_TITLE: ${{ github.event.issue.title }}
          VOTE_USER: ${{ github.event.issue.user.login }}
      - name: Commit chart
        if: steps.vote.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/colors.json assets/colors
          git commit -m "Color vote by @${VOTE_USER}"
          git pull --rebase
          git push
        env:
          VOTE_USER: ${{ github.event.issue.user.login }}
      - name: Reply and close the issue
        if: always()
        run: |
          printf '%s\n\n[Back to the profile](https://github.com/%s)' "$REPLY" "$GITHUB_REPOSITORY_OWNER" > reply.md
          gh issue comment "$NUMBER" --body-file reply.md
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPLY: ${{ steps.vote.outputs.reply || 'Something went wrong, sorry! Please try again later.' }}
