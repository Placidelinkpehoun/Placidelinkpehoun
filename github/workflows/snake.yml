name: Generate Snake Animation

on:
  schedule: 
    - cron: "0 0 * * *"  # Exécute une fois par jour à minuit
  workflow_dispatch:      # Permet de le lancer manuellement
  push:
    branches:
      - main              # Optionnel : le lancer à chaque push sur main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Placidelinkpehoun
          outputs: dist/github-contribution-grid-snake.svg
          outputs_dark: dist/github-contribution-grid-snake-dark.svg

      - name: Push generated snake files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
